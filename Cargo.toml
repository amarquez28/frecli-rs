[package]
name = "frecli-rs"
version = "1.0.0"
edition = "2024"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
chrono = "0.4.45"
clap = {version = "4.6.1", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
dirs = "6.0.0"
rusqlite = {version = "0.40.1", features = ["bundled"] }
tabled = "0.21.0"
thiserror = "2.0.18"
