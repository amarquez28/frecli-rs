name: Release

# Pushing a tag like v1.2.0 builds every platform and publishes a GitHub
# Release. Pull requests and manual runs build the same archives and keep them
# as downloadable artifacts without publishing a release, so a branch can be
# tested before it is merged. (Manual runs only show up in the Actions tab once
# this file is on the default branch.)
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rusqlite bundles SQLite, which is C code: musl needs its own gcc wrapper.
      - name: Install musl toolchain
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The archive has no version in its name so that
      # releases/latest/download/<name> always points at the newest release.
      - name: Package
        run: |
          mkdir stage
          cp target/${{ matrix.target }}/release/frecli-rs stage/
          cp scripts/hook.bash scripts/hook.zsh stage/
          tar -czf frecli-rs-${{ matrix.target }}.tar.gz -C stage frecli-rs hook.bash hook.zsh

      - uses: actions/upload-artifact@v4
        with:
          name: frecli-rs-${{ matrix.target }}
          path: frecli-rs-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
